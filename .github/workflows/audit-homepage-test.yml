name: Inspect disposable homepage test account
on:
  push:
    branches: [homepage-test-audit]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: criteria-backend
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check only the disposable account and its empty workspace
        run: node scripts/audit-homepage-test.mjs
