name: Recover approved analytics deployment
on:
  push:
    branches: [diagnostics/usage-deployment]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: criteria-backend
    concurrency:
      group: criteria-backend-deploy
      cancel-in-progress: false
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify retained usage records
        run: node scripts/usage-analytics-backend.mjs verify
      - name: Recover the unavailable API and verify readiness
        run: node scripts/usage-lock-diagnostics.mjs
      - name: Verify account isolation and background intake
        run: node scripts/core-live-smoke.mjs
