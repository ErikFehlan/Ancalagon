name: Validate and deploy GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, hardening/reliability]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript
        run: |
          node --check assets/app.js
          node --check assets/settings.js
          node --check assets/settings-ui.js
          node --check assets/admin-tools.js
          node --check assets/home.js
          node --check assets/tutorial.js
          node --check assets/tutorial-ui.js
          node --check assets/focus-ui.js
          node --check assets/select.js
          node --check assets/auth.js
          node --check assets/data.js
          node --check assets/scoring.js
          node --check assets/evidence.js
          node --check assets/context.js
          node --check assets/feedback.js
          node --check assets/job-review.js
          node --check assets/resume-intake.js
          node --check assets/resume-remote.js
          node --check assets/recruiter-workflow.js
          node --check assets/candidate-automation.js
          node --check assets/candidate-workspace.js
          node --check assets/quick-notes.js
          node --check assets/criteria-automation.js
          node --check assets/quality.js
          node --check assets/quality-ui.js
      - name: Run application tests
        run: node --test tests/*.test.js
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2 mammoth@1.8.0
          npx playwright install --with-deps chromium
      - name: Test recruiter browser journey
        run: |
          node tests/settings-browser.cjs
          node tests/browser-journey.cjs
          node tests/job-review-browser.cjs
          node tests/resume-intake-browser.cjs
          node tests/streamline-browser.cjs
          node tests/home-browser.cjs
          CAPTURE_UI=test-results/focus node tests/focus-browser.cjs
          node tests/core-browser.cjs
          node tests/recruiter-browser.cjs
          node tests/tutorial-browser.cjs
          node tests/admin-tools-browser.cjs

      - name: Save UI review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-review
          path: |
            test-results/tutorial-*.png
            test-results/focus-*.png
          if-no-files-found: ignore

  prepare-home:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: criteria-backend
    timeout-minutes: 5
    concurrency:
      group: criteria-backend-deploy
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare personal Home, tutorial progress, and admin tools before publishing
        run: node scripts/workspace-home-backend.mjs

  core-backend:
    if: github.ref == 'refs/heads/main'
    needs: validate
    uses: ./.github/workflows/core-backend.yml
    secrets: inherit

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [validate, prepare-home, core-backend]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage only public application files
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R assets _site/assets
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
