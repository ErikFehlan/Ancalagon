name: Validate and deploy GitHub Pages

on:
  push:
    branches: [main, hardening/reliability]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript
        run: |
          node --check assets/app.js
          node --check assets/select.js
          node --check assets/auth.js
          node --check assets/data.js
          node --check assets/scoring.js
          node --check assets/evidence.js
          node --check assets/context.js
          node --check assets/quality.js
          node --check assets/quality-ui.js
      - name: Run application tests
        run: node --test tests/*.test.js
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Test recruiter browser journey
        run: node tests/browser-journey.cjs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
