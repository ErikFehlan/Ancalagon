name: Read-only intake diagnostics
on:
  push:
    branches: [resume-intake-diagnostics]
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    environment: criteria-backend
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read non-identifying intake failure counts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: node scripts/intake-diagnostics.mjs
