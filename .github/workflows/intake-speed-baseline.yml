name: Synthetic intake performance baseline
on:
  push:
    branches: [resume-intake-speed-baseline]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    environment: criteria-backend
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Measure current intake using disposable synthetic accounts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: node scripts/core-live-smoke.mjs
